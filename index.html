<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dayr al Zaytoun · Lebanese Olive Oil</title>
<style>
:root{
  --bg:#EDEFE6; --paper:#FBFBF7; --ink:#1F261C; --muted:#5E6657; --line:#CFD4C3; --line-soft:#E2E6D8;
  --olive:#4E6A2C; --olive-deep:#35491E; --olive-soft:#E4EBD6;
  --oil:#B9851B; --oil-soft:#F5EBD0;
  --red:#9F3A2A; --red-soft:#F6E1DC; --amber:#B97514; --amber-soft:#F7EACF; --blue:#3D5C7A; --blue-soft:#DEE7EF;
  --stone:#7B7F72; --stone-soft:#E6E7E1; --plum:#6A4C7A; --plum-soft:#EAE1EF;
  --radius:6px; --shadow:0 1px 0 rgba(31,38,28,.06);
  font-size:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:1.35rem}h2{font-size:1.1rem}h3{font-size:.95rem}
p{margin:.25rem 0}
a{color:var(--olive-deep)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.tiny{font-size:.74rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85em}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--olive-deep);color:#F3F5EA;padding:0 12px;height:52px;display:flex;align-items:center;gap:10px}
.top .brand{font-weight:700;letter-spacing:.01em;white-space:nowrap}
.top .brand small{display:none;font-weight:400;font-size:.68rem;opacity:.8;letter-spacing:.06em;margin-top:-3px}
.top .spacer{flex:1}
.top select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:var(--radius);padding:4px 6px;font-size:.8rem;max-width:120px}
@media(min-width:600px){.top select{max-width:220px}}
@media(max-width:420px){.net #netLabel{display:none}.net{padding:6px 8px}}
.top select option{color:var(--ink)}
.net{display:flex;align-items:center;gap:6px;font-size:.78rem;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:var(--radius);padding:4px 8px;cursor:pointer;user-select:none}
.net .dot{width:8px;height:8px;border-radius:50%;background:#9CD672}
.net.off .dot{background:#E8A33B}
.offline-bar{background:var(--amber-soft);color:#5E3A05;border-bottom:1px solid #E5CFA0;padding:6px 12px;font-size:.82rem;display:none}
.offline-bar.show{display:block}

/* layout */
.shell{display:flex;max-width:1180px;margin:0 auto}
.side{display:none}
main{flex:1;min-width:0;padding:14px 12px 24px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav a{flex:1;text-align:center;padding:9px 2px 7px;font-size:.68rem;color:var(--muted);text-decoration:none;border-top:2px solid transparent}
.bottomnav a.on{color:var(--olive-deep);border-top-color:var(--olive);font-weight:600}
.bottomnav a span{display:block;font-size:1.05rem;line-height:1.1}
@media(min-width:900px){
  .top .brand small{display:block}
  body{padding-bottom:0}
  .bottomnav{display:none}
  .side{display:block;width:190px;padding:18px 10px;flex-shrink:0}
  .side a{display:block;padding:8px 10px;border-radius:var(--radius);color:var(--muted);text-decoration:none;font-size:.92rem}
  .side a.on{background:var(--olive-soft);color:var(--olive-deep);font-weight:600}
  main{padding:18px 18px 40px}
}

/* cards & sections */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:12px}
.card > .hd{padding:10px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card > .hd h2,.card > .hd h3{flex:1}
.card > .bd{padding:12px 14px}
.pagehead{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pagehead h1{flex:1;min-width:200px}
.pagehead .sub{color:var(--muted);font-size:.85rem;margin-top:2px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar select,.toolbar input{padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);font-size:.88rem}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--paper);cursor:pointer;font-size:.9rem;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:#F2F4EA}
.btn.primary{background:var(--olive);border-color:var(--olive);color:#fff}
.btn.primary:hover{background:var(--olive-deep)}
.btn.danger{background:var(--paper);border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:var(--red-soft)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.link{border:none;background:none;padding:2px 4px;color:var(--olive-deep);text-decoration:underline}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:.74rem;font-weight:600;white-space:nowrap;border:1px solid transparent}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.b-stone{background:var(--stone-soft);color:#4E5249}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-amber{background:var(--amber-soft);color:#7A4B07}
.b-olive{background:var(--olive-soft);color:var(--olive-deep)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-plum{background:var(--plum-soft);color:var(--plum)}
.b-oil{background:var(--oil-soft);color:#7A5410}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;background:var(--stone-soft);color:var(--muted);font-size:.7rem;font-weight:600;vertical-align:middle}
.tag.auto{background:var(--oil-soft);color:#7A5410}
.tag.queued{background:var(--amber-soft);color:#7A4B07}

/* forms */
.field{margin-bottom:12px}
.field label{display:block;font-size:.84rem;font-weight:600;margin-bottom:4px}
.field label .opt{font-weight:400;color:var(--muted)}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font-size:1rem}
.field textarea{min-height:64px;resize:vertical}
.field .help{font-size:.78rem;color:var(--muted);margin-top:3px}
.field input:focus,.field select:focus,.field textarea:focus,.btn:focus-visible,.check:focus-within{outline:2px solid var(--oil);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.readonly{background:var(--oil-soft);border:1px dashed #DDC58B;border-radius:var(--radius);padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.readonly .v{font-weight:600;font-size:1.05rem}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;margin-bottom:6px;cursor:pointer}
.check input{margin-top:3px;width:18px;height:18px;flex-shrink:0}
.check.dis{opacity:.55;cursor:not-allowed;background:var(--stone-soft)}
.check.sel{border-color:var(--olive);background:var(--olive-soft)}
.check .t{flex:1;min-width:0}
.check .t b{display:block;font-size:.92rem}
.check .t span{font-size:.8rem;color:var(--muted)}
details{border:1px solid var(--line-soft);border-radius:var(--radius);padding:6px 10px;margin:8px 0;background:#fff}
details summary{cursor:pointer;font-size:.86rem;font-weight:600;color:var(--olive-deep)}
details[open] summary{margin-bottom:8px}

/* banners */
.banner{padding:9px 12px;border-radius:var(--radius);font-size:.86rem;margin:8px 0;border:1px solid}
.banner.warn{background:var(--amber-soft);border-color:#E5CFA0;color:#5E3A05}
.banner.block{background:var(--red-soft);border-color:#E8B8AE;color:var(--red)}
.banner.info{background:var(--blue-soft);border-color:#C0D0DE;color:#243B4F}
.banner.ok{background:var(--olive-soft);border-color:#C6D5AC;color:var(--olive-deep)}
.banner b{font-weight:700}

/* tables & lists */
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.76rem;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover td{background:#F4F6EC}
.tbl{overflow-x:auto}
.runcard{display:block;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;text-decoration:none;color:inherit}
.runcard .l1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.runcard .l1 b{font-size:.98rem}
.runcard .l2{font-size:.82rem;color:var(--muted);margin-top:3px}
.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:4px 10px;font-size:.88rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.kv{margin:0}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:.9rem}

/* oil ledger strip: signature element */
.ledger{margin:10px 0}
.ledger .bar{display:flex;height:34px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.ledger .seg{display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:600;color:#fff;min-width:0;overflow:hidden;white-space:nowrap;padding:0 6px}
.ledger .seg.pk{background:var(--olive)}
.ledger .seg.ls{background:var(--oil)}
.ledger .seg.ng{background:var(--red)}
.ledger .legend{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:4px;gap:8px;flex-wrap:wrap}
.impact{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:10px 0}
.impact .row{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line-soft);font-size:.88rem}
.impact .row:last-child{border-bottom:none}
.impact .row .d{font-weight:600}
.impact .row .minus{color:var(--red)}.impact .row .plus{color:var(--olive-deep)}

/* wizard */
.steps{display:flex;gap:4px;margin-bottom:12px}
.steps button{flex:1;border:none;background:none;padding:0;cursor:pointer;text-align:left}
.steps .l{height:4px;border-radius:2px;background:var(--line);margin-bottom:4px}
.steps .done .l{background:var(--olive)}
.steps .cur .l{background:var(--oil)}
.steps .n{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.steps .cur .n{color:var(--ink);font-weight:600}

/* evidence */
.evgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:700px){.evgrid{grid-template-columns:repeat(4,1fr)}}
.ev{border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden}
.ev .ph{aspect-ratio:4/3;background:var(--stone-soft);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.8rem;position:relative}
.ev .ph img{width:100%;height:100%;object-fit:cover;display:block}
.ev .cap{padding:6px 8px;font-size:.8rem}
.ev .cap b{display:block}
.ev input[type=file]{display:none}
.ev .act{display:flex;gap:4px;padding:0 8px 8px}
.progress{height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden;margin:6px 0}
.progress i{display:block;height:100%;background:var(--olive)}

/* audit */
.audit{list-style:none;margin:0;padding:0}
.audit li{padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:.84rem;display:grid;grid-template-columns:auto 1fr;gap:10px}
.audit li time{color:var(--muted);font-size:.76rem;white-space:nowrap}
.audit li b{font-weight:600}
.audit li .who{color:var(--muted)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(31,38,28,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal-bg{align-items:center}}
.modal{background:var(--paper);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:10px 10px 0 0;padding:16px 16px 20px}
@media(min-width:700px){.modal{border-radius:10px}}
.modal h2{margin-bottom:8px}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:var(--ink);color:#fff;padding:9px 14px;border-radius:var(--radius);font-size:.86rem;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:92vw}
@media(min-width:900px){.toast{bottom:24px}}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs a{padding:8px 12px;text-decoration:none;color:var(--muted);font-size:.88rem;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--olive-deep);border-bottom-color:var(--olive);font-weight:600}
.trace{max-width:520px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px}
.trace .brand{font-size:.8rem;letter-spacing:.08em;color:var(--muted)}
.trace h1{font-size:1.5rem;margin:4px 0 10px}
.qrbox{width:84px;height:84px;background:repeating-linear-gradient(90deg,#222 0 6px,#fff 6px 12px),repeating-linear-gradient(#222 0 6px,#fff 6px 12px);background-blend-mode:difference;border:4px solid #fff;outline:1px solid var(--line);float:right;margin:0 0 8px 12px}

/* home */
.hero{background:var(--olive-deep);color:#F3F5EA;border-radius:8px;padding:22px 18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(185,133,27,.55),rgba(185,133,27,0) 70%)}
.hero .eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--oil);font-weight:700;margin-bottom:8px}
.hero h1{font-size:1.6rem;line-height:1.15;max-width:22ch}
.hero p{max-width:52ch;opacity:.9;margin:10px 0 14px;font-size:.95rem}
.hero .btnrow{margin:0}
.hero .btn{background:var(--oil);border-color:var(--oil);color:#1F261C}
.hero .btn.ghost{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
.flow{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:700px){.flow{grid-template-columns:repeat(4,1fr)}}
.flow .st{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:#fff;font-size:.86rem}
.flow .st b{display:block;font-size:.95rem;margin-bottom:2px}
.flow .st .k{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--olive);color:#fff;text-align:center;line-height:22px;font-size:.78rem;font-weight:700;margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.two{grid-template-columns:1fr 1fr}}
.plain{margin:0;padding-left:18px;font-size:.9rem}
.plain li{margin:4px 0}
.founder{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.founder .ava{width:84px;height:84px;border-radius:50%;background:var(--olive-soft);color:var(--olive-deep);display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;flex-shrink:0;border:2px solid var(--olive)}
.founder .fx{flex:1;min-width:220px}
.founder .fx h3{font-size:1.05rem}
.founder .fx .role{color:var(--muted);font-size:.86rem;margin-bottom:6px}
.ph{background:var(--amber-soft);border-bottom:1px dashed var(--amber);padding:0 2px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:#fff}
.stat .n{font-size:1.5rem;font-weight:700;color:var(--olive-deep);line-height:1.1}
.stat .l{font-size:.78rem;color:var(--muted)}
.chain{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.chain .cs{flex:0 0 200px;scroll-snap-align:start;border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:10px 12px;font-size:.82rem;position:relative}
.chain .cs.here{border-color:var(--oil);background:var(--oil-soft)}
.chain .cs b{display:block;font-size:.92rem;margin-bottom:3px}
.chain .cs .idx{font-size:.68rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.chain .cs::after{content:"→";position:absolute;right:-12px;top:12px;color:var(--muted);font-size:1rem}
.chain .cs:last-child::after{content:""}
@media(min-width:900px){.chain{display:grid;grid-template-columns:repeat(4,1fr);overflow:visible}.chain .cs::after{content:""}}
.insight{border-left:3px solid var(--oil);padding:6px 10px;margin-bottom:10px;background:#fff;border-radius:0 var(--radius) var(--radius) 0}
.insight .m{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.insight b{display:block;font-size:.95rem}
.insight p{font-size:.86rem;margin:3px 0 0}
.chap{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.84rem;padding:4px 0;border-bottom:1px solid var(--line-soft)}
.chap .cid{font-family:ui-monospace,Menlo,monospace;font-size:.76rem;color:var(--muted);padding-top:2px}
.chap.here{background:var(--oil-soft);margin:0 -10px;padding:6px 10px;border-radius:4px}
@media(prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#home" style="color:inherit;text-decoration:none">Dayr al Zaytoun<small>Lebanese Olive Oil · Packaging runs</small></a>
  <div class="spacer"></div>
  <select id="roleSel" title="Signed-in user" aria-label="Switch user"></select>
  <div class="net" id="net" role="button" tabindex="0" title="Toggle connectivity (prototype)"><span class="dot"></span><span id="netLabel">Online</span></div>
</header>
<div class="offline-bar" id="offlineBar">Working offline. Draft edits are queued and will sync when you reconnect. Completing a run needs a connection.</div>
<div class="shell">
  <nav class="side" id="sideNav"></nav>
  <main id="app"></main>
</div>
<nav class="bottomnav" id="bottomNav"></nav>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
/* ========================= STATE & SEED ========================= */
const ROLES={
  'Field Staff':{draft:true,complete:false,claims:false,admin:false,user:'Rami Haddad'},
  'Production Lead':{draft:true,complete:true,claims:false,admin:false,user:'Nour Khoury'},
  'Marketing':{draft:false,complete:false,claims:true,admin:false,user:'Lina Saab'},
  'Admin':{draft:true,complete:true,claims:true,admin:true,user:'Georges Aoun'}
};
const RUN_STATUS=['Draft','Ready for Review','In Progress','Completed','Correction Requested','Archived'];
const LOSS_REASONS=['Filling-system retention','Spillage','Line priming','Overfill / underfill adjustment','Measurement difference','Sampling','Other'];
const PKG_TYPES=['Glass Bottle','Tin','PET','Bag-in-Box','Ceramic','Other'];
const MATERIALS=['Dark Glass','Clear Glass','Metal / Tin','PET / Plastic','Ceramic','Composite','Other','Unknown'];
const COLORS=['Dark Green','Amber / Brown','Clear','Other','Unknown'];
const CLOSURES=['Screw Cap','Pourer','Cork','Synthetic Cork','Tamper-Evident Cap','Flip Cap','Other','Unknown'];
const TAMPER=['Present','Not Present','Unknown'];
const QR_STATUS=['Not Used','Planned','Generated','Printed','Active','Disabled'];
const VERIF=['Not Checked','Verified','Flagged'];
const CLAIM_STATES=['Farmer Declared','Supported','Supported with Limitations','Unsupported','Rejected','Expired','Superseded'];
const ELIGIBLE=new Set(['Farmer Declared','Supported','Supported with Limitations']);
const JOB_STATUS=['Requested','Waiting','Cancelled','Ready','Processing','Partial','Completed','Failed','Admin Review'];
const RETENTION=['Active','Archived','Pending Deletion','Deleted','Retained by Policy','Anonymized'];
const EV_SLOTS=[['empty','Empty packaging'],['filling','Filling in progress'],['finished','Finished labelled units'],['label','Label / lot code close-up']];

const S={
  role:'Production Lead', online:true, queue:[], seq:{PR:4,PI:1,COR:0,DJ:1,MV:8,EV:0},
  farm:{id:'F1',name:'Dayr al Zaytoun',region:'Koura, North Lebanon'},

  <div class="card"><div class="hd"><h2>The bigger picture</h2></div><div class="bd">
  <p class="small">This app is one working piece of a larger design: a ${SPEC.phases.reduce((a,p)=>a+p[1].length,0)}-chapter Developer System Requirements Specification for an AI-assisted platform for Lebanese olive farmers. It builds two of those chapters, Packaging (C17) and Data Retention and Deletion (C28), as a usable prototype.</p>
  <div class="stats" style="margin:10px 0"><div class="stat"><div class="n">${SPEC.phases.reduce((a,p)=>a+p[1].length,0)}</div><div class="l">Specification chapters</div></div><div class="stat"><div class="n">6</div><div class="l">Platform phases</div></div><div class="stat"><div class="n">0</div><div class="l">Autonomous AI decisions permitted</div></div><div class="stat"><div class="n">2</div><div class="l">Chapters built here</div></div></div>
  <h3 style="margin-top:8px">The question</h3><p class="small">${esc(SPEC.question)}</p>
  <h3 style="margin-top:10px">The approach</h3><p class="small">${esc(SPEC.approach)}</p>
  </div></div>

  <div class="card"><div class="hd"><h2>The trust chain</h2><span class="small muted">from one olive to a claim a customer can believe</span></div><div class="bd">
  <div class="chain">${SPEC.chain.map(([n,b],i)=>`<div class="cs ${i===SPEC.chain.length-1?'here':''}"><div class="idx">Stage ${i+1}${i===SPEC.chain.length-1?' · this app':''}</div><b>${esc(n)}</b>${esc(b)}</div>`).join('')}</div>
  <p class="tiny muted" style="margin-top:6px">Each stage is a domain defined in the specification, in the order the oil actually moves.</p></div></div>

  <div class="card"><div class="hd"><h2>How a packaging run works here</h2></div><div class="bd">
  <p class="small muted" style="margin-bottom:10px">One run is one physical event: oil from a single batch or blend batch, filled into one product and one packaging variant. Packaging never creates a new batch; every bottle keeps its lineage back to the source oil.</p>
  <div class="flow">
    <div class="st"><span class="k">1</span><b>Draft</b>Pick the product and variant, the source batch and the tanks holding it. Add a planned count and the app shows the oil needed. Nothing moves yet, and drafts work offline.</div>
    <div class="st"><span class="k">2</span><b>Label and evidence</b>Choose only claims that are currently supported, set the lot code and date label, and photograph the empty packaging, the fill, the finished units and the label.</div>
    <div class="st"><span class="k">3</span><b>Start</b>A Production Lead starts the run, which reserves the planned volume so another run cannot take the same oil.</div>
    <div class="st"><span class="k">4</span><b>Complete</b>Enter actual units and oil withdrawn. The app reconciles withdrawn against packaged plus loss, previews the inventory impact, then writes withdrawal, loss, packaged stock, label snapshot and audit entry in one step.</div>
  </div></div></div>

  <div class="two">
  <div class="card"><div class="hd"><h3>Rules the app enforces</h3></div><div class="bd"><ul class="plain">
    <li>One source batch and one product plus variant per run. Mixing products means a second run.</li>
    <li>Every tank used must hold the same source batch.</li>
    <li>Unit volume always comes from the packaging variant, never typed in.</li>
    <li>Planned counts are non-binding; only completion moves inventory.</li>
    <li>Withdrawn oil must equal packaged oil plus documented loss within a configurable tolerance.</li>
    <li>The label and its claims are frozen at completion. Later label changes never rewrite history.</li>
    <li>Duplicate lot codes and duplicate photos warn, they never silently block.</li>
    <li>Completed runs are corrected through correction records, not edited, and cannot be reversed as if they never happened.</li>
    <li>QR codes resolve to a public traceability page for the printed lot code, never to internal ids.</li>
    <li>The app does not assess legal fill volume, metrology or shelf-life requirements.</li>
  </ul></div></div>
  <div class="card"><div class="hd"><h3>Who does what</h3></div><div class="bd"><ul class="plain">
    <li><b>Field Staff</b> create and edit drafts and add evidence.</li>
    <li><b>Production Lead</b> starts and completes runs, reviews corrections, verifies and archives.</li>
    <li><b>Marketing</b> manages claim support states and label versions. No inventory rights.</li>
    <li><b>Admin</b> holds all of the above plus retention policies, business rules and deletion requests.</li>
  </ul><p class="small muted" style="margin-top:8px">Inventory permission and marketing permission are separate on purpose. Switch users from the menu at the top to try each view.</p>
  <h3 style="margin-top:12px">Who the platform is for</h3><p class="small"><b>Primary:</b> ${esc(SPEC.users.primary)}</p><p class="small"><b>Secondary:</b> ${esc(SPEC.users.secondary)}</p><p class="small"><b>Success means:</b> ${esc(SPEC.users.success)}</p></div></div>
  </div>

  <div class="card"><div class="hd"><h2>Design principles</h2><span class="small muted">what makes this more than a feature list</span></div><div class="bd"><div class="two">${SPEC.insights.map(([m,t,b])=>`<div class="insight"><div class="m">${esc(m)}</div><b>${esc(t)}</b><p>${esc(b)}</p></div>`).join('')}</div>
  <p class="small muted">You can see these in this app: withdrawn oil can be Exact, Estimated or a Range; materials allow Unknown; the date label comes from a farm rule a person reviews, never from an AI guess; drafts queue offline.</p></div></div>

  <div class="card"><div class="hd"><h3>Data retention and deletion</h3></div><div class="bd"><ul class="plain">
    <li>Every record carries a retention state: ${RETENTION.map(badge).join(' ')}</li>
    <li><b>Archive is not deletion.</b> Archived records keep their ids and relationships and can be shown again at any time.</li>
    <li>Deletion is a workflow: request, waiting period, job, tombstone. Requests can be cancelled until the job is ready.</li>
    <li>Completed runs and storage movements are finalized history. Deleting them is admin-gated and leaves the operational record retained by policy; only evidence and personal fields are removed.</li>
    <li>The inventory ledger is never deleted because a balance reaches zero, and removing a user never removes shared farm history.</li>
    <li>Policy changes are audit-logged with who, when, old value and new value.</li>
  </ul></div></div>

  <div class="card"><div class="hd"><h2>Chapter map</h2><span class="small muted">${SPEC.phases.reduce((a,p)=>a+p[1].length,0)} chapters in 6 phases</span></div><div class="bd">
  ${SPEC.phases.map(([n,ch],i)=>`<details ${i===3||i===5?'open':''}><summary>${String(i+1).padStart(2,'0')} · ${esc(n)} <span class="tag">${ch.length}</span></summary>${ch.map(([id,t])=>`<div class="chap ${SPEC.here.includes(id)?'here':''}"><span class="cid">${id}</span><span>${esc(t)}${SPEC.here.includes(id)?' <span class="tag auto">built in this app</span>':''}</span></div>`).join('')}</details>`).join('')}
  </div></div>

  <div class="card"><div class="hd"><h3>What Version 1 deliberately leaves out</h3></div><div class="bd"><p class="small muted">The specification is clear about its own boundaries. These are a roadmap for after a working V1, not gaps.</p><div class="two">${SPEC.roadmap.map(([t,b])=>`<div class="insight" style="border-left-color:var(--stone)"><b>${esc(t)}</b><p>${esc(b)}</p></div>`).join('')}</div>
  <p class="small">For this packaging module specifically: no bottling-line or hardware integration, no barcode or RFID warehouse system, no full MRP or ERP, no order fulfilment or shipping, no automated compliance submissions, no legal-hold suite.</p></div></div>

  <div class="card"><div class="hd"><h2>About the project</h2></div><div class="bd">
    <div class="founder"><div class="ava">${esc(ABOUT.founder.initials)}</div><div class="fx"><h3>${esc(ABOUT.founder.name)}</h3><div class="role">${esc(ABOUT.founder.role)} · ${esc(ABOUT.founder.since)}</div></div></div>
    <dl class="kv" style="margin-top:12px"><dt>Source</dt><dd class="small">${esc(SPEC.title)}. Built as a passion project; all specification material is original.</dd><dt>Business</dt><dd>${PH(ABOUT.business)}</dd><dt>Region</dt><dd>${esc(ABOUT.region)}</dd><dt>Established</dt><dd>${PH(ABOUT.established)}</dd></dl>
  </div></div>`;
}

/* ========================= ROUTER ========================= */
const NAV=[['#home','Home','⌂'],['#runs','Runs','▤'],['#inventory','Inventory','◫'],['#labels','Labels','◈'],['#admin','Admin','⚙']];
function nav(){
  const h=location.hash||'#home';const key=h.split('/')[0];
  const items=NAV.filter(n=>n[0]!=='#labels'||perm().claims);
  $('#sideNav').innerHTML=items.map(n=>`<a href="${n[0]}" class="${key===n[0]?'on':''}">${n[1]}</a>`).join('');
  $('#bottomNav').innerHTML=items.map(n=>`<a href="${n[0]}" class="${key===n[0]?'on':''}"><span>${n[2]}</span>${n[1]}</a>`).join('');
}
function render(){
  nav();
  const h=location.hash||'#home';const parts=h.split('/');const app=$('#app');
  try{
    if(parts[0]==='#home')app.innerHTML=viewHome();
    else if(parts[0]==='#runs')app.innerHTML=viewList();
    else if(parts[0]==='#run'&&parts[1]==='new')app.innerHTML=viewWizard(null);
    else if(parts[0]==='#run'&&parts[2]==='edit')app.innerHTML=viewWizard(parts[1]);
    else if(parts[0]==='#run')app.innerHTML=viewDetail(parts[1]);
    else if(parts[0]==='#inventory')app.innerHTML=viewInventory();
    else if(parts[0]==='#labels')app.innerHTML=viewLabels();
    else if(parts[0]==='#admin')app.innerHTML=viewAdmin(parts[1]||'retention');
    else if(parts[0]==='#trace')app.innerHTML=viewTrace(decodeURIComponent(parts[1]||''));
    else app.innerHTML=viewHome();
  }catch(e){app.innerHTML=`<div class="banner block">Something went wrong rendering this screen: ${esc(e.message)}</div>`;console.error(e)}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
/* ========================= RUN LIST ========================= */
const F={status:'',product:'',source:'',sort:'date_desc',archived:false,q:''};
function viewList(){
  let rows=S.runs.filter(r=>r.retention!=='Deleted');
  if(!F.archived)rows=rows.filter(r=>r.status!=='Archived');
  if(F.status)rows=rows.filter(r=>r.status===F.status);
  if(F.product)rows=rows.filter(r=>r.productId===F.product);
  if(F.source)rows=rows.filter(r=>r.sourceId===F.source);
  if(F.q){const q=F.q.toLowerCase();rows=rows.filter(r=>(r.id+' '+r.name+' '+r.lotCode).toLowerCase().includes(q))}
  rows.sort((a,b)=>{if(F.sort==='date_asc')return a.dateStart.localeCompare(b.dateStart);if(F.sort==='status')return RUN_STATUS.indexOf(a.status)-RUN_STATUS.indexOf(b.status);if(F.sort==='product')return (prod(a.productId)||{name:''}).name.localeCompare((prod(b.productId)||{name:''}).name);return b.dateStart.localeCompare(a.dateStart)});
  const canCreate=perm().draft;
  const queued=S.queue.length;
  return `<div class="pagehead"><div><h1>Packaging runs</h1><div class="sub">${S.farm.name}, ${S.farm.region}${queued?` · <span class="tag queued">${queued} queued offline</span>`:''}</div></div>
    <a class="btn primary" href="#run/new" ${canCreate?'':'aria-disabled="true" onclick="event.preventDefault();toast(\'Your role cannot create runs. Ask a Field Staff or Production Lead user.\')"'}>New run</a></div>
  <div class="toolbar">
    <input type="search" placeholder="Search id, name, lot code" value="${esc(F.q)}" oninput="F.q=this.value;render();this.focus();this.setSelectionRange(this.value.length,this.value.length)">
    <select onchange="F.status=this.value;render()"><option value="">All statuses</option>${RUN_STATUS.map(s=>`<option ${F.status===s?'selected':''}>${s}</option>`).join('')}</select>
    <select onchange="F.product=this.value;render()"><option value="">All products</option>${S.products.map(p=>`<option value="${p.id}" ${F.product===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <select onchange="F.source=this.value;render()"><option value="">All sources</option>${S.batches.map(b=>`<option value="${b.id}" ${F.source===b.id?'selected':''}>${b.id}</option>`).join('')}</select>
    <select onchange="F.sort=this.value;render()"><option value="date_desc" ${F.sort==='date_desc'?'selected':''}>Newest first</option><option value="date_asc" ${F.sort==='date_asc'?'selected':''}>Oldest first</option><option value="status" ${F.sort==='status'?'selected':''}>By status</option><option value="product" ${F.sort==='product'?'selected':''}>By product</option></select>
    <label class="small" style="display:flex;gap:5px;align-items:center"><input type="checkbox" ${F.archived?'checked':''} onchange="F.archived=this.checked;render()"> Show archived</label>
  </div>
  ${rows.length?rows.map(r=>{const v=variant(r.variantId),p=prod(r.productId);const th=theoreticalL(r);
    return `<a class="runcard" href="#run/${r.id}"><div class="l1"><b>${esc(r.name||r.id)}</b>${badge(r.status)}</div>
    <div class="l2">${r.id} · ${esc(p?p.name:'No product yet')}${v?' · '+v.name:''} · ${fmtD(r.dateStart)}${r.dateEnd?' to '+fmtD(r.dateEnd):''}</div>
    <div class="l2 num">${r.sourceId?'Source '+r.sourceId:'No source yet'}${r.actualUnits?` · ${fmtN(r.actualUnits)} units packed`:r.plannedUnits?` · ${fmtN(r.plannedUnits)} planned (${fmtL(th)})`:''}${r.lotCode?' · '+esc(r.lotCode):''}${r.syncState==='queued'?' <span class="tag queued">queued</span>':''}${r.retention!=='Active'&&r.retention!=='Archived'?' '+badge(r.retention):''}</div></a>`}).join(''):
    `<div class="card"><div class="empty">No runs match these filters.${canCreate?' Start a new run when oil is about to be bottled.':''}</div></div>`}`;
}

/* ========================= RUN DETAIL ========================= */
function viewDetail(id){
  const r=run(id);if(!r)return `<div class="banner block">Run ${esc(id)} was not found.</div><a class="btn" href="#runs">Back to runs</a>`;
  if(r.retention==='Deleted')return `<div class="pagehead"><div><h1>${r.id}</h1><div class="sub">Deletion tombstone</div></div>${badge('Deleted')}</div>
    <div class="card"><div class="bd"><p>This record was deleted through the retention workflow on ${fmtDT(r.tomb.at)} (job ${r.tomb.job}). Only this minimal marker is kept so the record cannot be restored from a backup by accident.</p>
    <p class="small muted">Audit entries for this record are retained under the audit policy.</p></div></div>${auditBlock('run',r.id)}<a class="btn" href="#runs">Back to runs</a>`;
  const p=prod(r.productId),v=variant(r.variantId),b=batch(r.sourceId);const th=theoreticalL(r);const pi=S.packaged.find(x=>x.id===r.packagedId);
  const P=perm();const st=r.status;const online=S.online;
  const acts=[];
  if((st==='Draft'||st==='Ready for Review')&&P.draft)acts.push(`<a class="btn" href="#run/${r.id}/edit">Edit draft</a>`);
  if(st==='Draft'&&P.draft)acts.push(`<button class="btn" onclick="A.setStatus('${r.id}','Ready for Review')">Mark ready for review</button>`);
  if((st==='Draft'||st==='Ready for Review')&&P.complete)acts.push(`<button class="btn primary" onclick="A.startRun('${r.id}')">Start run</button>`);
  if((st==='Draft'||st==='Ready for Review')&&P.draft)acts.push(`<button class="btn danger" onclick="A.cancelDraft('${r.id}')">Cancel draft</button>`);
  if(st==='In Progress'&&P.complete)acts.push(`<button class="btn primary" ${online?'':'disabled title="Completing a run needs a connection"'} onclick="A.openComplete('${r.id}')">Complete run</button>`);
  if(st==='In Progress'&&P.complete)acts.push(`<button class="btn" onclick="A.stopRun('${r.id}')">Back to draft</button>`);
  if(st==='Completed'&&P.draft)acts.push(`<button class="btn" onclick="A.openCorrection('${r.id}')">Request correction</button>`);
  if(st==='Correction Requested'&&P.complete)acts.push(`<button class="btn primary" onclick="A.applyCorrection('${r.id}')">Review correction</button>`);
  if(st==='Completed'&&P.complete)acts.push(`<button class="btn" onclick="A.archive('${r.id}')">Archive</button>`);
  if(st==='Archived'&&P.complete)acts.push(`<button class="btn" onclick="A.unarchive('${r.id}')">Restore from archive</button>`);
  if(P.admin&&(r.retention==='Active'||r.retention==='Archived'))acts.push(`<button class="btn danger sm" onclick="A.requestDeletion('run','${r.id}')">Request deletion</button>`);
  const claimsBanner=st!=='Completed'&&st!=='Archived'?claimIssues(r).map(i=>`<div class="banner ${i.block?'block':'warn'}">Claim "${esc(i.c.text)}" is ${i.c.state}. ${i.block?'Completion is blocked until it is removed from the label or its support state changes.':'High risk: complete only if Marketing has approved this label.'}</div>`).join(''):'';
  const offline=st==='In Progress'&&!online?`<div class="banner warn">Offline. You can still add evidence photos; completing the run needs a connection so inventory is updated in one step.</div>`:'';
  const snap=r.labelSnapshot;
  return `<div class="pagehead"><div><h1>${esc(r.name||r.id)}</h1><div class="sub">${r.id} · created ${fmtD(r.createdAt)} by ${esc(r.createdBy)}${r.syncState==='queued'?' · <span class="tag queued">queued offline</span>':''}</div></div><div>${badge(st)} ${r.retention!=='Active'?badge(r.retention):''}</div></div>
  ${claimsBanner}${offline}${r.retention==='Pending Deletion'?'<div class="banner info">A deletion request is open for this record. It stays fully readable until the job runs.</div>':''}
  <div class="btnrow" style="margin:0 0 12px">${acts.join('')}</div>

  <div class="card"><div class="hd"><h3>Run</h3></div><div class="bd"><dl class="kv">
    <dt>Product</dt><dd>${p?esc(p.name)+' <span class="small muted">('+p.brand+')</span> '+(p.status!=='Active'?badge(p.status):''):'–'}</dd>
    <dt>Packaging variant</dt><dd>${v?v.name+' <span class="tag auto">'+v.unitMl+' ml per unit</span>':'–'}</dd>
    <dt>Date</dt><dd>${fmtD(r.dateStart)}${r.dateEnd?' to '+fmtD(r.dateEnd):''}${r.time?' · '+r.time:''}</dd>
    <dt>Source</dt><dd>${b?`${b.id} <span class="small muted">${b.type==='BlendBatch'?'Blend batch':'Batch'} · ${esc(b.name)}</span>`:'–'}</dd>
    <dt>Storage</dt><dd>${r.storageIds.length?r.storageIds.map(sid=>{const s=storage(sid);return s?esc(s.name):sid}).join('<br>'):'–'}</dd>
    <dt>Verification</dt><dd>${badge(r.verification)} ${P.complete&&(st==='Completed'||st==='Correction Requested')?`<select class="small" onchange="A.verify('${r.id}',this.value)">${VERIF.map(x=>`<option ${x===r.verification?'selected':''}>${x}</option>`).join('')}</select>`:''}</dd>
  </dl></div></div>

  <div class="card"><div class="hd"><h3>Oil and units</h3></div><div class="bd">
    <div class="grid2">
      <div class="readonly"><span>Planned units</span><span class="v num">${fmtN(r.plannedUnits)}</span></div>
      <div class="readonly"><span>Actual units</span><span class="v num">${fmtN(r.actualUnits)}</span></div>
      <div class="readonly"><span>Theoretical oil <span class="tag auto">auto</span></span><span class="v num">${fmtL(th)}</span></div>
      <div class="readonly"><span>Oil withdrawn${r.withdrawType!=='Exact'?' <span class="tag">'+r.withdrawType+'</span>':''}</span><span class="v num">${fmtL(r.withdrawnL)}</span></div>
    </div>
    ${r.withdrawType==='Range'&&r.withdrawLow!=null?`<p class="small muted">Recorded as a range ${fmtL(r.withdrawLow)} to ${fmtL(r.withdrawHigh)}; the midpoint is used for inventory.</p>`:''}
    ${r.lossL!=null?ledger(r.withdrawnL,th,r.lossL)+`<p class="small"><b>Loss reason:</b> ${esc(r.lossReason)}${r.lossNote?' · '+esc(r.lossNote):''}</p>`:'<p class="small muted">Loss is calculated automatically at completion as withdrawn minus packaged volume.</p>'}
    ${r.cost!=null?`<p class="small num"><b>Packaging cost:</b> ${fmtN(r.cost)} ${r.currency} · <b>per unit</b> ${r.actualUnits?(r.cost/r.actualUnits).toFixed(2):'–'} ${r.currency} <span class="tag auto">auto</span></p>`:''}
  </div></div>

  <div class="card"><div class="hd"><h3>Materials</h3></div><div class="bd"><dl class="kv">
    <dt>Package</dt><dd>${esc(r.pkg.type||'–')} · ${esc(r.pkg.material||'–')} · ${esc(r.pkg.color||'–')}</dd>
    <dt>Closure</dt><dd>${esc(r.pkg.closure||'–')} · tamper evidence ${esc(r.pkg.tamper||'Unknown')}</dd>
    <dt>Suppliers</dt><dd>${['bottle','cap','label','carton'].filter(k=>r.sup[k]).map(k=>k+': '+esc(supplier(r.sup[k]))).join(', ')||'<span class="muted">none recorded</span>'}${r.sup.lot?' · supplier lot '+esc(r.sup.lot):''}</dd>
  </dl></div></div>

  <div class="card"><div class="hd"><h3>Label</h3>${snap?'<span class="tag">frozen at completion</span>':'<span class="tag">live, not yet frozen</span>'}</div><div class="bd">
    ${snap?`<dl class="kv"><dt>Product on label</dt><dd>${esc(snap.product)} · ${esc(snap.brand)} · ${esc(snap.volume)}</dd><dt>Label version</dt><dd>${esc(snap.labelVersion)}${p&&p.labelVersion!==snap.labelVersion?` <span class="small muted">(product now on ${p.labelVersion}; this run keeps its snapshot)</span>`:''}</dd>
      <dt>Claims</dt><dd>${snap.claims.length?snap.claims.map(c=>esc(c.text)+' '+badge(c.state)).join('<br>'):'<span class="muted">none</span>'}</dd><dt>Lot code</dt><dd class="mono">${esc(snap.lot||'–')}</dd><dt>Date label</dt><dd>${esc(r.bestBefore.text||'–')}</dd><dt>QR</dt><dd>${esc(snap.qr)}${r.lotCode&&['Generated','Printed','Active'].includes(r.qrStatus)?` · <a href="#trace/${encodeURIComponent(r.lotCode)}">preview public page</a>`:''}</dd><dt>Legal text</dt><dd class="small">${esc(snap.legal)}</dd></dl>`
    :`<dl class="kv"><dt>Label version</dt><dd>${esc(r.labelVersionId||(p?p.labelVersion:'–'))}</dd><dt>Claims selected</dt><dd>${r.claimIds.length?r.claimIds.map(claim).filter(Boolean).map(c=>esc(c.text)+' '+badge(c.state)).join('<br>'):'<span class="muted">none</span>'}</dd><dt>Lot code</dt><dd class="mono">${esc(r.lotCode||'–')}</dd><dt>Date label</dt><dd>${r.bestBefore.mode==='none'?'<span class="muted">not set</span>':esc(r.bestBefore.text||bbFromRule(r.dateStart))+(r.bestBefore.reviewed?' <span class="tag">reviewed</span>':' <span class="tag queued">needs review</span>')}</dd><dt>QR</dt><dd>${esc(r.qrStatus)}</dd></dl>`}
  </div></div>

  <div class="card"><div class="hd"><h3>Evidence</h3><span class="small muted">${evidenceCount(r)} of 4, all optional</span></div><div class="bd">
    <div class="evgrid">${EV_SLOTS.map(([k,l])=>evSlot(r,k,l,(st==='In Progress'||st==='Completed'||st==='Draft'||st==='Ready for Review')&&P.draft,'A.detailEvidence')).join('')}</div>
  </div></div>

    <dt>Product availability</dt><dd>${p?esc(p.name)+' now has '+fmtN(S.packaged.filter(x=>x.productId===p.id).reduce((a,x)=>a+x.units-x.reserved-x.depleted,0))+' sellable units across all lots':'–'}</dd>

function ledger(withdrawn,packed,loss){
  if(withdrawn==null||packed==null)return '';
  const neg=loss<0;const total=Math.max(withdrawn,packed);const pk=Math.min(packed,withdrawn)/total*100;const ls=Math.abs(loss)/total*100;
  return `<div class="ledger"><div class="bar"><div class="seg pk" style="width:${pk}%">Packaged ${fmtL(packed)}</div><div class="seg ${neg?'ng':'ls'}" style="width:${Math.max(ls,3)}%" title="${neg?'Underfill ':'Loss '}${fmtL(Math.abs(loss))}">${ls>=14?(neg?'Underfill ':'Loss ')+fmtL(Math.abs(loss)):''}</div></div>
  <div class="legend"><span>Withdrawn ${fmtL(withdrawn)}</span><span>= packaged ${fmtL(packed)} ${neg?'−':'+'} ${neg?'underfill':'documented loss'} ${fmtL(Math.abs(loss))}</span></div></div>`;
}
function evSlot(r,k,label,editable,handler){

  <div class="cap"><b>${label} <span class="tag">optional</span></b>${e?`<span class="tiny muted">${esc(e.name)} · ${fmtDT(e.at)}</span>`:''}</div>
  ${editable?`<div class="act"><label class="btn sm">${e?'Replace':'Add photo'}<input type="file" accept="image/*" capture="environment" onchange="${handler}('${r.id||''}','${k}',this)"></label>${e?`<button class="btn sm" onclick="${handler}('${r.id||''}','${k}',null)">Remove</button>`:''}</div>`:''}</div>`;
}
function auditBlock(ent,id){
  const list=S.audit.filter(a=>a.ent===ent&&a.id===id).sort((a,b)=>b.ts.localeCompare(a.ts));
  return `<div class="card"><div class="hd"><h3>Activity</h3><span class="small muted">${list.length} entries</span></div><div class="bd">${list.length?`<ul class="audit">${list.map(a=>`<li><time>${fmtDT(a.ts)}</time><div><b>${esc(a.act)}</b> <span class="who">· ${esc(a.who)}, ${esc(a.role)}</span><br><span class="small">${esc(a.detail)}</span></div></li>`).join('')}</ul>`:'<div class="empty">No activity yet.</div>'}</div></div>`;
}

/* ========================= DETAIL ACTIONS ========================= */
const A={};

A.detailEvidence=(id,k,input)=>{const r=run(id);if(!input){r.evidence[k]=null;audit('run',id,'Evidence removed',k);render();return}
  readFile(input,ev=>{const d=dupEvidence(ev,id);if(d.length)toast('Warning: this photo looks identical to evidence on '+d.join(', ')+'. Saved anyway.');r.evidence[k]=ev;audit('run',id,'Evidence added',EV_SLOTS.find(s=>s[0]===k)[1]+(d.length?' (possible duplicate of '+d.join(', ')+')':''));if(!S.online){r.syncState='queued';S.queue.push({kind:'evidence',id,at:nowISO()})}render()})};

  Object.entries(res).forEach(([k,v])=>S.movements.push({id:uid('MV'),ts:nowISO(),type:'Soft reservation',storageId:k,liters:-v,ref:id,note:'Run started; planned volume reserved until completion'}));

/* ---- completion ---- */
const C={};
A.openComplete=id=>{const r=run(id);Object.assign(C,{id,units:r.plannedUnits||'',type:r.withdrawType||'Exact',w:'',lo:'',hi:'',reason:r.lossReason||'',note:'',cost:r.cost??'',bbRev:r.bestBefore.reviewed,lot:r.lotCode||''});renderComplete()};
A.cset=(k,v)=>{C[k]=v;renderComplete(true)};
function completeCalc(){
  const r=run(C.id);const v=variant(r.variantId);const units=parseInt(C.units)||0;const th=units*v.unitMl/1000;
  let w=parseFloat(C.w);if(C.type==='Range'){const lo=parseFloat(C.lo),hi=parseFloat(C.hi);w=(!isNaN(lo)&&!isNaN(hi))?(lo+hi)/2:NaN}
  const loss=isNaN(w)?NaN:Math.round((w-th)*100)/100;const tol=S.settings.tolerancePct/100*(w||0);
  const blocks=[],warns=[];
  if(!S.online)blocks.push('You are offline. Completion updates inventory in one step and needs a connection.');
  if(units<=0)blocks.push('Actual unit count must be greater than zero.');
  if(isNaN(w)||w<=0)blocks.push('Enter the oil actually withdrawn from storage.');
  if(!isNaN(loss)&&Math.abs(loss)>tol&&w>0)blocks.push(`Withdrawn and packaged volumes differ by ${fmtL(Math.abs(loss))}, more than the ${S.settings.tolerancePct}% tolerance (${fmtL(tol)}). Recheck the unit count or the meter reading before completing.`);
  if(!isNaN(loss)&&Math.abs(loss)>0.05&&!C.reason)blocks.push('Choose a reason for the difference between withdrawn and packaged oil.');
  if(!isNaN(loss)&&loss<-0.05)warns.push('Withdrawn is less than the packaged volume. This is recorded as an underfill context, not as a fill-volume finding; the app does not assess legal fill compliance.');
  const issues=claimIssues(r);issues.forEach(i=>(i.block?blocks:warns).push(`Claim "${i.c.text}" is ${i.c.state}.`));
  if(r.bestBefore.mode!=='none'&&!C.bbRev)blocks.push('Review the date label text before completing. It comes from a configured rule, not from a legal check.');
  const dl=dupLot(C.lot,r.id);if(dl.length)warns.push('Lot code '+C.lot+' is already used on '+dl.join(', ')+'. Allowed, but check it is intended.');
  const alloc={};let left=isNaN(w)?0:w;const short=[];
  r.storageIds.forEach(sid=>{const s=storage(sid);const av=s.liters-reservedOn(sid,r.id);const take=Math.min(av,left);if(take>0){alloc[sid]=Math.round(take*100)/100;left-=take}});
  if(left>0.01&&!isNaN(w)){blocks.push(`Only ${fmtL(w-left)} is available on the chosen storage; ${fmtL(left)} short. Other runs may hold reservations.`)}
  const cost=parseFloat(C.cost);
  return {r,v,units,th,w,loss,tol,blocks,warns,alloc,cost:isNaN(cost)?null:cost};
}
function renderComplete(keep){

    <div class="grid3"><select onchange="A.cset('type',this.value)">${['Exact','Estimated','Range'].map(x=>`<option ${C.type===x?'selected':''}>${x}</option>`).join('')}</select>
    ${C.type==='Range'?`<input type="number" step="0.1" placeholder="from L" value="${esc(C.lo)}" oninput="A.cset('lo',this.value)"><input type="number" step="0.1" placeholder="to L" value="${esc(C.hi)}" oninput="A.cset('hi',this.value)">`:`<input type="number" step="0.1" inputmode="decimal" placeholder="liters" value="${esc(C.w)}" oninput="A.cset('w',this.value)" style="grid-column:span 2">`}</div>
    <div class="help">From the tank meter or scale. Reservations from other runs are respected.</div></div>
  ${!isNaN(k.loss)&&k.w>0?ledger(k.w,k.th,k.loss):''}
  ${!isNaN(k.loss)&&Math.abs(k.loss)>0.05?`<div class="grid2"><div class="field"><label>Reason for the difference</label><select onchange="A.cset('reason',this.value)"><option value="">Choose</option>${LOSS_REASONS.map(x=>`<option ${C.reason===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Note <span class="opt">optional</span></label><input type="text" value="${esc(C.note)}" oninput="C.note=this.value"></div></div>`:''}
  <div class="grid2"><div class="field"><label>Printed lot code</label><input type="text" value="${esc(C.lot)}" oninput="A.cset('lot',this.value)"><div class="help">Internal id ${r.id} stays linked whatever is printed.</div></div>
  <div class="field"><label>Packaging cost <span class="opt">optional, ${r.currency}</span></label><input type="number" step="0.01" value="${esc(C.cost)}" oninput="A.cset('cost',this.value)">${k.cost!=null&&k.units?`<div class="help num">${(k.cost/k.units).toFixed(2)} ${r.currency} per unit <span class="tag auto">auto</span></div>`:''}</div></div>

  ${k.blocks.map(b=>`<div class="banner block">${esc(b)}</div>`).join('')}
  <h3 style="margin-top:12px">Inventory impact</h3>
  <div class="impact">${Object.entries(k.alloc).map(([sid,l])=>`<div class="row"><span>${esc(storage(sid).name)}</span><span class="d minus num">− ${fmtL(l)}</span></div>`).join('')||'<div class="row muted">Enter withdrawn volume to see storage impact</div>'}
    <div class="row"><span>Batch ${r.sourceId}</span><span class="d minus num">− ${fmtL(isNaN(k.w)?0:k.w)}</span></div>
    <div class="row"><span>Packaged inventory, ${esc(prod(r.productId).name)} ${k.v.name}</span><span class="d plus num">+ ${fmtN(k.units)} units</span></div>
    <div class="row"><span>Documented loss</span><span class="d num">${isNaN(k.loss)?'–':(k.loss<0?'underfill ':'')+fmtL(Math.abs(k.loss))}</span></div>
    <div class="row"><span>Label snapshot</span><span class="d">frozen (${esc(r.labelVersionId||prod(r.productId).labelVersion)})</span></div></div>

  if(keep){const m=$('.modal');const focus=document.activeElement;const sel=focus&&focus.selectionStart;const path=focus&&focus.getAttribute('oninput');m.innerHTML=html;if(path){const el=[...m.querySelectorAll('[oninput]')].find(e=>e.getAttribute('oninput')===path);if(el){el.focus();try{el.setSelectionRange(sel,sel)}catch(e){}}}}

A.doComplete=()=>{

  const snapshot={product:p.name,brand:p.brand,volume:k.v.unitMl>=1000?(k.v.unitMl/1000)+' L':k.v.unitMl+' ml',claims:r.claimIds.map(claim).filter(Boolean).map(c=>({id:c.id,text:c.text,state:c.state})),lot:C.lot,qr:r.qrStatus,legal:p.legal,labelVersion:r.labelVersionId||p.labelVersion,frozenAt:ts};

  moves.forEach(m=>{m.id=uid('MV');S.movements.push(m)});
  S.packaged.push({id:piId,runId:r.id,productId:r.productId,variantId:r.variantId,sourceId:r.sourceId,lotCode:C.lot,units:k.units,reserved:0,depleted:0,status:'Available',createdAt:ts});

/* ========================= WIZARD ========================= */
