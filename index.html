const STEPS=['Product','Source','Plan','Label','Evidence'];
function viewWizard(id){
  if(!perm().draft)return `<div class="banner block">Your role (${esc(S.role)}) cannot create or edit draft runs.</div><a class="btn" href="#runs">Back</a>`;
  if(id){const r=run(id);if(!r)return '<div class="banner block">Run not found.</div>';if(r.status!=='Draft'&&r.status!=='Ready for Review')return `<div class="banner block">Only Draft or Ready for Review runs can be edited. Completed runs are changed through corrections.</div><a class="btn" href="#run/${id}">Back to run</a>`;
    if(W.editing!==id){W.d=JSON.parse(JSON.stringify(r));W.editing=id;W.step=0}}
  else if(W.editing!==null||!W.d){W.d=newRun();W.editing=null;W.step=0}
  const d=W.d;
  const steps=`<div class="steps">${STEPS.map((s,i)=>`<button class="${i<W.step?'done':i===W.step?'cur':''}" onclick="A.wStep(${i})"><div class="l"></div><span class="n">${i+1}. ${s}</span></button>`).join('')}</div>`;
  const body=[wStep1,wStep2,wStep3,wStep4,wStep5][W.step](d);
  return `<div class="pagehead"><div><h1>${id?'Edit '+esc(d.name||d.id):'New packaging run'}</h1><div class="sub">Drafts never touch inventory. Save any time and finish later, even offline.</div></div>${d.syncState==='queued'?'<span class="tag queued">queued offline</span>':''}</div>
  ${steps}<div class="card"><div class="bd">${body}</div></div>
  <div class="btnrow">${W.step>0?`<button class="btn" onclick="A.wStep(${W.step-1})">Back</button>`:''}${W.step<4?`<button class="btn primary" onclick="A.wNext()">Next</button>`:''}
  <span style="flex:1"></span><button class="btn" onclick="A.wSave('Draft')">Save draft</button>${W.step===4?`<button class="btn primary" onclick="A.wSave('Ready for Review')">Save and mark ready</button>`:''}
  <a class="btn link" href="${id?'#run/'+id:'#runs'}" onclick="W.editing=undefined;W.d=null">Discard changes</a></div>`;
}
A.wStep=i=>{W.step=i;render()};
A.wNext=()=>{const d=W.d;const e=wValidate(W.step,d);if(e){toast(e);return}W.step++;render()};
function wValidate(step,d){
  if(step===0&&(!d.productId||!d.variantId))return 'Choose a product and a packaging variant.';
  if(step===1&&(!d.sourceId||!d.storageIds.length))return 'Choose a source batch and at least one storage.';
  return '';
}
A.w=(k,v)=>{const d=W.d;const path=k.split('.');let o=d;while(path.length>1)o=o[path.shift()];o[path[0]]=v;render()};
A.wProduct=pid=>{const d=W.d;d.productId=pid;d.variantId='';const p=prod(pid);d.labelVersionId=p?p.labelVersion:'';d.claimIds=[];render()};
A.wVariant=vid=>{const d=W.d;const v=variant(vid);d.variantId=vid;d.pkg={type:v.type,material:v.material,color:v.color,closure:v.closure,tamper:v.tamper};render()};
A.wSource=bid=>{const d=W.d;d.sourceId=bid;d.storageIds=[];render()};
A.wStorage=(sid,on)=>{const d=W.d;d.storageIds=on?[...new Set([...d.storageIds,sid])]:d.storageIds.filter(x=>x!==sid);render()};
A.wClaim=(cid,on)=>{const d=W.d;d.claimIds=on?[...new Set([...d.claimIds,cid])]:d.claimIds.filter(x=>x!==cid);render()};
A.wEvidence=(_,k,input)=>{const d=W.d;if(!input){d.evidence[k]=null;render();return}readFile(input,ev=>{const dup=dupEvidence(ev,d.id);if(dup.length)toast('Warning: this photo looks identical to evidence on '+dup.join(', ')+'. Kept anyway.');ev.dup=dup;d.evidence[k]=ev;render()})};
A.wSave=status=>{const d=W.d;const e=wValidate(0,d);if(e){W.step=0;render();toast(e);return}
  if(status==='Ready for Review'){const e2=wValidate(1,d);if(e2){W.step=1;render();toast(e2);return}const bl=claimIssues(d).filter(i=>i.block);if(bl.length){W.step=3;render();toast('Remove the '+bl[0].c.state.toLowerCase()+' claim before marking ready.');return}}
  const isNew=!d.id;if(isNew){d.id=uid('PR');d.createdAt=nowISO();d.createdBy=me()}
  if(d.bestBefore.mode==='rule')d.bestBefore.text=bbFromRule(d.dateStart);
  const prev=isNew?null:run(d.id).status;d.status=status;d.syncState=S.online?'synced':'queued';
  Object.keys(d.evidence).forEach(k=>{if(d.evidence[k])delete d.evidence[k].dup});
  if(isNew)S.runs.push(d);else Object.assign(run(d.id),d);
  if(!S.online)S.queue.push({kind:isNew?'create':'update',id:d.id,at:nowISO()});
  audit('run',d.id,isNew?'Created draft':'Draft saved',`${prod(d.productId).name}, ${variant(d.variantId).name}${prev&&prev!==status?'. Status '+prev+' → '+status:''}${S.online?'':' (offline, queued)'}`);
  const dl=dupLot(d.lotCode,d.id);if(dl.length)toast('Saved. Note: lot code also used on '+dl.join(', '));else toast(S.online?'Saved':'Saved offline, will sync when connected');
  W.editing=undefined;W.d=null;location.hash='#run/'+d.id;};

function wStep1(d){
  const p=prod(d.productId);
  return `<h2>Product and packaging variant</h2><p class="small muted">One product and one variant per run. Filling a second product? Save this run and start another.</p>
  <div class="grid2"><div class="field"><label>Run name <span class="opt">optional</span></label><input type="text" placeholder="e.g. Christmas 500 ml run" value="${esc(d.name)}" onchange="A.w('name',this.value)"></div>
  <div class="field"><label>Packaging date</label><input type="date" value="${d.dateStart}" onchange="A.w('dateStart',this.value)"></div></div>
  <details><summary>Multi-day run or start time</summary><div class="grid2"><div class="field"><label>End date <span class="opt">optional</span></label><input type="date" value="${d.dateEnd}" onchange="A.w('dateEnd',this.value)"></div><div class="field"><label>Start time <span class="opt">optional</span></label><input type="time" value="${d.time}" onchange="A.w('time',this.value)"></div></div></details>
  <div class="field"><label>Product</label>${S.products.map(x=>`<label class="check ${x.status!=='Active'?'dis':''} ${d.productId===x.id?'sel':''}"><input type="radio" name="prod" ${x.status!=='Active'?'disabled':''} ${d.productId===x.id?'checked':''} onchange="A.wProduct('${x.id}')"><div class="t"><b>${esc(x.name)} ${x.status!=='Active'?badge(x.status):''}</b><span>${esc(x.brand)} · label ${x.labelVersion}${x.status!=='Active'?' · cannot accept new runs':''}</span></div></label>`).join('')}</div>
  ${p?`<div class="field"><label>Packaging variant</label>${S.variants.filter(v=>v.productId===p.id).map(v=>`<label class="check ${d.variantId===v.id?'sel':''}"><input type="radio" name="var" ${d.variantId===v.id?'checked':''} onchange="A.wVariant('${v.id}')"><div class="t"><b>${v.name}</b><span>${v.unitMl>=1000?v.unitMl/1000+' L':v.unitMl+' ml'} per unit · ${v.type}, ${v.material}, ${v.closure}</span></div></label>`).join('')}</div>`:''}
  ${d.variantId?`<div class="readonly"><span>Unit volume <span class="tag auto">from variant</span></span><span class="v num">${variant(d.variantId).unitMl} ml</span></div>
  <details><summary>Materials (filled from the variant, adjust if different this time)</summary><div class="grid2">
    ${[['type','Package type',PKG_TYPES],['material','Material',MATERIALS],['color','Bottle colour',COLORS],['closure','Closure',CLOSURES],['tamper','Tamper evidence',TAMPER]].map(([k,l,opts])=>`<div class="field"><label>${l}</label><select onchange="A.w('pkg.${k}',this.value)">${opts.map(o=>`<option ${d.pkg[k]===o?'selected':''}>${o}</option>`).join('')}</select></div>`).join('')}</div></details>`:''}`;
}
function wStep2(d){
  const v=variant(d.variantId);const need=d.plannedUnits&&v?d.plannedUnits*v.unitMl/1000:null;
  return `<h2>Source oil and storage</h2><p class="small muted">One batch or blend batch per run. Every storage you pick must hold that same batch.</p>
  <div class="field"><label>Source</label>${S.batches.map(b=>{const av=batchAvail(b.id,d.id);const dis=!!b.blocked||av<=0;return `<label class="check ${dis?'dis':''} ${d.sourceId===b.id?'sel':''}"><input type="radio" name="src" ${dis?'disabled':''} ${d.sourceId===b.id?'checked':''} onchange="A.wSource('${b.id}')"><div class="t"><b>${b.id} <span class="tag">${b.type==='BlendBatch'?'Blend batch':'Batch'}</span></b><span>${esc(b.name)} · harvest ${b.harvest} · <span class="num">${fmtL(av)} available</span>${b.blocked?'<br><span style="color:var(--red)">Blocked: '+esc(b.blocked)+'</span>':''}</span></div></label>`}).join('')}</div>
  ${d.sourceId?`<div class="field"><label>Storage holding ${d.sourceId}</label>${batchStorages(d.sourceId).map(s=>{const res=reservedOn(s.id,d.id);const av=storageAvail(s,d.id);const holders=S.runs.filter(r=>r.status==='In Progress'&&r.id!==d.id&&r.reservations[s.id]).map(r=>r.id);return `<label class="check ${d.storageIds.includes(s.id)?'sel':''}"><input type="checkbox" ${d.storageIds.includes(s.id)?'checked':''} onchange="A.wStorage('${s.id}',this.checked)"><div class="t"><b>${esc(s.name)}</b><span class="num">${fmtL(s.liters)} on hand${res?`, ${fmtL(res)} reserved by ${holders.join(', ')}`:''} · <b>${fmtL(av)} available</b></span></div></label>`}).join('')}
  ${need?(()=>{const av=d.storageIds.reduce((a,sid)=>a+storageAvail(storage(sid),d.id),0);return need>av?`<div class="banner block">Planned ${fmtL(need)} exceeds ${fmtL(av)} available on the chosen storage. Pick more storage, lower the plan, or wait for the other run to finish. The app will not override a reservation.</div>`:`<div class="banner ok">Planned ${fmtL(need)} fits within ${fmtL(av)} available.</div>`})():''}</div>`:''}`;
}
function wStep3(d){
  const v=variant(d.variantId);const need=d.plannedUnits&&v?d.plannedUnits*v.unitMl/1000:null;const av=d.storageIds.reduce((a,sid)=>a+storageAvail(storage(sid),d.id),0);
  return `<h2>Plan</h2><p class="small muted">Planning only. Inventory moves when the run is completed with actual counts.</p>
  <div class="grid2"><div class="field"><label>Planned units <span class="opt">optional</span></label><input type="number" min="0" inputmode="numeric" value="${d.plannedUnits??''}" oninput="W.d.plannedUnits=this.value?parseInt(this.value):null;A.wLive()"></div>
  <div class="readonly"><span>Oil needed <span class="tag auto">auto</span></span><span class="v num" id="liveNeed">${fmtL(need)}</span></div></div>
  <div id="liveBanner">${need?(need>av?`<div class="banner warn">Needs ${fmtL(need)}; ${fmtL(av)} available on the chosen storage.</div>`:`<div class="banner ok">${fmtL(need)} of ${fmtL(av)} available.</div>`):''}</div>
  <p class="small muted">${v?`${v.unitMl} ml × units, shown in litres.`:''} Starting the run reserves this volume so other runs cannot take it.</p>`;
}
A.wLive=()=>{const d=W.d;const v=variant(d.variantId);const need=d.plannedUnits&&v?d.plannedUnits*v.unitMl/1000:null;const av=d.storageIds.reduce((a,sid)=>a+storageAvail(storage(sid),d.id),0);
  $('#liveNeed').textContent=fmtL(need);$('#liveBanner').innerHTML=need?(need>av?`<div class="banner warn">Needs ${fmtL(need)}; ${fmtL(av)} available on the chosen storage.</div>`:`<div class="banner ok">${fmtL(need)} of ${fmtL(av)} available.</div>`):''};
function wStep4(d){
  const p=prod(d.productId);const cl=(p.claimIds||[]).map(claim).filter(Boolean);const elig=cl.filter(c=>ELIGIBLE.has(c.state)),inel=cl.filter(c=>!ELIGIBLE.has(c.state));
  const issues=claimIssues(d);const dl=dupLot(d.lotCode,d.id);
  return `<h2>Label and claims</h2><p class="small muted">What goes on the label for this run. It is frozen at completion, so later label changes never alter this run.</p>
  ${issues.map(i=>`<div class="banner ${i.block?'block':'warn'}">"${esc(i.c.text)}" is now ${i.c.state}. ${i.block?'Remove it to continue; policy blocks completion.':'High risk; needs Marketing approval before completion.'}</div>`).join('')}
  <div class="field"><label>Claims eligible for ${esc(p.name)}</label>${elig.length?elig.map(c=>`<label class="check ${d.claimIds.includes(c.id)?'sel':''}"><input type="checkbox" ${d.claimIds.includes(c.id)?'checked':''} onchange="A.wClaim('${c.id}',this.checked)"><div class="t"><b>${esc(c.text)} ${badge(c.state)}</b><span>${esc(c.note)}</span></div></label>`).join(''):'<p class="small muted">No eligible claims.</p>'}
  ${inel.length?`<details><summary>${inel.length} claim${inel.length>1?'s':''} not eligible right now</summary>${inel.map(c=>`<label class="check dis ${d.claimIds.includes(c.id)?'sel':''}"><input type="checkbox" ${d.claimIds.includes(c.id)?'checked':''} onchange="A.wClaim('${c.id}',this.checked)"><div class="t"><b>${esc(c.text)} ${badge(c.state)}</b><span>${esc(c.note)}. ${d.claimIds.includes(c.id)?'Untick to remove from this label.':'Ask Marketing to update the support state.'}</span></div></label>`).join('')}</details>`:''}</div>
  <div class="grid2"><div class="field"><label>Printed lot code <span class="opt">optional now, needed at completion</span></label><input type="text" value="${esc(d.lotCode)}" onchange="A.w('lotCode',this.value)"><div class="help">Internal id stays linked. <button class="btn link" onclick="A.w('lotCode','${lotSuggest(d.dateStart)}')">Use pattern ${esc(lotSuggest(d.dateStart))}</button>${dl.length?'<br><span style="color:var(--amber)">Also used on '+dl.join(', ')+'.</span>':''}</div></div>
  <div class="field"><label>QR traceability</label><select onchange="A.w('qrStatus',this.value)">${QR_STATUS.map(q=>`<option ${d.qrStatus===q?'selected':''}>${q}</option>`).join('')}</select><div class="help">QR codes point only to the public traceability page for the printed lot code, never to internal ids.</div></div></div>
  <div class="field"><label>Date label</label><select onchange="A.w('bestBefore.mode',this.value)"><option value="none" ${d.bestBefore.mode==='none'?'selected':''}>Not printed</option><option value="rule" ${d.bestBefore.mode==='rule'?'selected':''} ${S.settings.bbRuleOn?'':'disabled'}>From farm rule (${S.settings.bbMonths} months after packaging date)${S.settings.bbRuleOn?'':' — rule disabled by Admin'}</option><option value="manual" ${d.bestBefore.mode==='manual'?'selected':''}>Enter the printed text</option></select>
    ${d.bestBefore.mode==='rule'?`<div class="readonly" style="margin-top:6px"><span>Text <span class="tag auto">rule</span></span><span class="v">${bbFromRule(d.dateStart)}</span></div>`:d.bestBefore.mode==='manual'?`<input type="text" style="margin-top:6px" placeholder="e.g. Best before 03/2028" value="${esc(d.bestBefore.text)}" onchange="A.w('bestBefore.text',this.value)">`:''}
    <div class="help">You will confirm this text at completion. The app does not judge shelf life or legal date requirements.</div></div>
  <details><summary>Supplier references (optional)</summary><div class="grid2">${['bottle','cap','label','carton'].map(k=>`<div class="field"><label>${k[0].toUpperCase()+k.slice(1)} supplier</label><select onchange="A.w('sup.${k}',this.value)"><option value="">None</option>${S.suppliers.map(s=>`<option value="${s.id}" ${d.sup[k]===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>`).join('')}<div class="field"><label>Supplier lot reference</label><input type="text" value="${esc(d.sup.lot)}" onchange="A.w('sup.lot',this.value)"></div></div></details>
  <div class="grid2"><div class="field"><label>Packaging cost <span class="opt">optional</span></label><input type="number" step="0.01" value="${d.cost??''}" onchange="A.w('cost',this.value?parseFloat(this.value):null)"></div><div class="field"><label>Currency</label><select onchange="A.w('currency',this.value)">${['USD','LBP','EUR'].map(c=>`<option ${d.currency===c?'selected':''}>${c}</option>`).join('')}</select></div></div>`;
}
function wStep5(d){
  const n=evidenceCount(d);
  return `<h2>Evidence photos</h2><p class="small muted">Guided checklist. All four are optional; a missing photo never blocks completion.</p>
  <div class="progress"><i style="width:${n*25}%"></i></div><p class="small num">${n} of 4 captured</p>
  <div class="evgrid">${EV_SLOTS.map(([k,l])=>evSlot(d,k,l,true,'A.wEvidence')).join('')}</div>
  ${Object.values(d.evidence).some(e=>e&&e.dup&&e.dup.length)?'<div class="banner warn">One or more photos look identical to evidence already attached to another run. Saving is allowed; check you have the right photo.</div>':''}
  <p class="small muted" style="margin-top:10px">Offline? Photos are kept on this device and uploaded when you reconnect.</p>`;
}

/* ========================= INVENTORY ========================= */
function viewInventory(){
  return `<div class="pagehead"><div><h1>Inventory</h1><div class="sub">Bulk oil in storage and finished packaged stock</div></div></div>
  <div class="card"><div class="hd"><h3>Bulk oil by batch</h3></div><div class="bd">${S.batches.map(b=>`<div style="margin-bottom:10px"><b>${b.id}</b> <span class="small muted">${esc(b.name)}</span>${b.blocked?' '+badge('Flagged'):''}
    <table><thead><tr><th>Storage</th><th class="num">On hand</th><th class="num">Reserved</th><th class="num">Available</th></tr></thead><tbody>${batchStorages(b.id).map(s=>`<tr><td>${esc(s.name)}</td><td class="num">${fmtL(s.liters)}</td><td class="num">${fmtL(reservedOn(s.id))}</td><td class="num"><b>${fmtL(storageAvail(s))}</b></td></tr>`).join('')}</tbody></table></div>`).join('')}</div></div>
  <div class="card"><div class="hd"><h3>Packaged inventory</h3></div><div class="bd tbl">${S.packaged.length?`<table><thead><tr><th>Lot</th><th>Product</th><th>Source</th><th class="num">Units</th><th class="num">Reserved</th><th class="num">Shipped</th><th class="num">Available</th></tr></thead><tbody>${S.packaged.map(pi=>`<tr class="row" onclick="location.hash='#run/${pi.runId}'"><td><b>${esc(pi.lotCode||pi.id)}</b><br><span class="tiny muted">${pi.id} · run ${pi.runId}</span></td><td>${esc(prod(pi.productId).name)}<br><span class="tiny muted">${variant(pi.variantId).name}</span></td><td>${pi.sourceId}</td><td class="num">${fmtN(pi.units)}</td><td class="num">${fmtN(pi.reserved)}</td><td class="num">${fmtN(pi.depleted)}</td><td class="num"><b>${fmtN(pi.units-pi.reserved-pi.depleted)}</b></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No packaged stock yet. Complete a run to create it.</div>'}
  <p class="tiny muted">Reservations and shipments are owned by the sales and fulfilment modules (out of scope for V1); stubs shown for lineage.</p></div></div>
  <div class="card"><div class="hd"><h3>Movement ledger</h3><span class="small muted">never deleted, even at zero balance</span></div><div class="bd tbl"><table><thead><tr><th>When</th><th>Movement</th><th>Where</th><th class="num">Amount</th><th>Ref</th></tr></thead><tbody>${[...S.movements].sort((a,b)=>b.ts.localeCompare(a.ts)).map(m=>`<tr><td class="tiny muted">${fmtDT(m.ts)}</td><td>${esc(m.type)}<br><span class="tiny muted">${esc(m.note)}</span></td><td>${m.storageId?esc(storage(m.storageId).name.split(',')[0]):m.packagedId||''}</td><td class="num ${(m.liters??m.units)<0?'':''}">${m.liters!=null?(m.liters>0?'+':'')+fmtL(m.liters):(m.units>0?'+':'')+fmtN(m.units)+' units'}</td><td class="tiny">${esc(m.ref)}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* ========================= LABELS (claims) ========================= */
function viewLabels(){
  if(!perm().claims)return '<div class="banner block">Marketing or Admin access is needed to manage claims and label versions.</div>';
  return `<div class="pagehead"><div><h1>Labels and claims</h1><div class="sub">Support states drive what a run may print. Changing them never rewrites completed runs.</div></div></div>
  <div class="card"><div class="hd"><h3>Product claims</h3></div><div class="bd tbl"><table><thead><tr><th>Claim</th><th>Support state</th><th>Basis</th></tr></thead><tbody>${S.claims.map(c=>`<tr><td><b>${esc(c.text)}</b><br><span class="tiny muted">used by ${S.products.filter(p=>p.claimIds.includes(c.id)).map(p=>p.name).join(', ')||'no product'}</span></td><td><select onchange="A.claimState('${c.id}',this.value)">${CLAIM_STATES.map(s=>`<option ${c.state===s?'selected':''}>${s}</option>`).join('')}</select></td><td class="small">${esc(c.note)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="card"><div class="hd"><h3>Product label versions</h3></div><div class="bd">${S.products.map(p=>`<div class="small" style="padding:6px 0;border-bottom:1px solid var(--line-soft)"><b>${esc(p.name)}</b> ${badge(p.status)} · current label <span class="mono">${p.labelVersion}</span> <button class="btn sm" onclick="A.bumpLabel('${p.id}')">Publish new version</button><br><span class="muted">Runs already completed keep the version they were completed with.</span></div>`).join('')}</div></div>
  ${auditBlock('product','P1')}`;
}
A.claimState=(cid,s)=>{const c=claim(cid);audit('claim',cid,'Support state changed',`${c.text}: ${c.state} → ${s}`);c.state=s;render();toast('Claim updated. Open drafts using it will show a warning.')};
A.bumpLabel=pid=>{const p=prod(pid);const n=parseInt(p.labelVersion.split('v')[1])+1;const nv=`LV-${pid}-v${n}`;audit('product',pid,'Label version changed',`${p.labelVersion} → ${nv}. Historical runs keep their frozen snapshot.`);p.labelVersion=nv;S.runs.forEach(r=>{if(r.productId===pid&&(r.status==='Draft'||r.status==='Ready for Review'||r.status==='In Progress'))r.labelVersionId=nv});render();toast('Published '+nv+'. Open runs now point at it; completed runs are untouched.')};

/* ========================= ADMIN ========================= */
function viewAdmin(tab){
  const P=perm();
  const tabs=`<div class="tabs">${[['retention','Retention policies'],['deletion','Deletion requests'],['rules','Business rules'],['audit','Policy audit']].map(([k,l])=>`<a href="#admin/${k}" class="${tab===k?'on':''}">${l}</a>`).join('')}</div>`;
  const ro=!P.admin?'<div class="banner info">Read only. Only Admin users can change retention policies or business rules.</div>':'';
  let body='';
  if(tab==='retention')body=`<div class="card"><div class="hd"><h3>Retention by data category</h3><span class="small muted">0 = no automatic expiry</span></div><div class="bd tbl"><table><thead><tr><th>Category</th><th class="num">Window (days)</th><th>Notes</th></tr></thead><tbody>${S.policies.map((p,i)=>`<tr><td><b>${esc(p.cat)}</b></td><td class="num"><input type="number" min="0" value="${p.days}" style="width:90px;padding:5px;border:1px solid var(--line);border-radius:4px" ${P.admin?'':'disabled'} onchange="A.policy(${i},this.value)"></td><td class="small">${esc(p.note)}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="card"><div class="hd"><h3>Retention states</h3></div><div class="bd small"><p>${RETENTION.map(badge).join(' ')}</p><p><b>Archive is not deletion.</b> Archived records keep their ids and relationships and can be viewed with "Show archived". Deletion is a request, a waiting period, a job, then a tombstone.</p><p>Deleting a user account never removes shared farm, business or operational history. Finalized runs and storage movements are corrected or archived, not deleted, through normal workflows.</p></div></div>`;
  if(tab==='deletion')body=`<div class="card"><div class="hd"><h3>Deletion requests</h3><span class="small">${JOB_STATUS.map(badge).join(' ')}</span></div><div class="bd">${S.jobs.length?S.jobs.map(j=>{const cancellable=['Requested','Waiting','Admin Review'].includes(j.status)&&P.admin;return `<div style="padding:8px 0;border-bottom:1px solid var(--line-soft)"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${j.id}</b> ${badge(j.status)} <span class="small">${esc(j.label)}</span></div>
    <div class="small muted">Requested ${fmtDT(j.requestedAt)} by ${esc(j.requestedBy)} · waiting ${j.waitingDays} days · ready ${fmtD(j.readyAt)} · ${esc(j.reason)}</div>
    ${j.result?`<div class="small">${esc(j.result)}</div>`:''}
    <div class="btnrow" style="margin-top:6px">${cancellable?`<button class="btn sm" onclick="A.jobCancel('${j.id}')">Cancel request</button>`:''}${j.status==='Admin Review'&&P.admin?`<button class="btn sm primary" onclick="A.jobApprove('${j.id}')">Approve, start waiting period</button>`:''}${j.status==='Waiting'&&P.admin?`<button class="btn sm" onclick="A.jobReady('${j.id}')">Simulate waiting period elapsed</button>`:''}${j.status==='Ready'&&P.admin?`<button class="btn sm danger" onclick="A.jobRun('${j.id}')">Run deletion job</button>`:''}${j.status==='Failed'&&P.admin?`<button class="btn sm" onclick="A.jobRun('${j.id}')">Retry</button>`:''}<a class="btn sm link" href="#run/${j.entId}">Open record</a></div></div>`}).join(''):'<div class="empty">No deletion requests. Requests are made from a record\'s page by an Admin.</div>'}
    <p class="tiny muted" style="margin-top:8px">A completed job leaves a tombstone so the record cannot come back from a backup restore. Backups are not edited; restores reconcile against tombstones.</p></div></div>`;
  if(tab==='rules')body=`<div class="card"><div class="hd"><h3>Business rules</h3></div><div class="bd"><div class="grid2">
    <div class="field"><label>Reconciliation tolerance (%)</label><input type="number" step="0.5" min="0" value="${S.settings.tolerancePct}" ${P.admin?'':'disabled'} onchange="A.setting('tolerancePct',parseFloat(this.value))"><div class="help">Withdrawn must equal packaged plus documented loss within this share of withdrawn volume.</div></div>
    <div class="field"><label>Ineligible claim policy</label><select ${P.admin?'':'disabled'} onchange="A.setting('claimPolicy',this.value)"><option value="block" ${S.settings.claimPolicy==='block'?'selected':''}>Block completion</option><option value="warn" ${S.settings.claimPolicy==='warn'?'selected':''}>Warn (high-risk banner)</option></select></div>
    <div class="field"><label>Date label rule</label><select ${P.admin?'':'disabled'} onchange="A.setting('bbRuleOn',this.value==='1')"><option value="1" ${S.settings.bbRuleOn?'selected':''}>Enabled</option><option value="0" ${!S.settings.bbRuleOn?'selected':''}>Disabled</option></select></div>
    <div class="field"><label>Months after packaging date</label><input type="number" min="1" value="${S.settings.bbMonths}" ${P.admin?'':'disabled'} onchange="A.setting('bbMonths',parseInt(this.value))"><div class="help">A farm rule, reviewed by a person before completion. Never an AI-generated legal date.</div></div>
    <div class="field"><label>Lot code pattern</label><input type="text" value="${esc(S.settings.lotPattern)}" ${P.admin?'':'disabled'} onchange="A.setting('lotPattern',this.value)"><div class="help">Tokens: {YYMMDD}, {N}</div></div>
    <div class="field"><label>Deletion waiting period (days)</label><input type="number" min="0" value="${S.settings.waitingDays}" ${P.admin?'':'disabled'} onchange="A.setting('waitingDays',parseInt(this.value))"></div>
    </div></div></div>
    <div class="card"><div class="hd"><h3>Roles</h3></div><div class="bd tbl"><table><thead><tr><th>Role</th><th>Draft runs</th><th>Complete runs</th><th>Approve claims</th><th>Retention admin</th></tr></thead><tbody>${Object.entries(ROLES).map(([k,v])=>`<tr><td><b>${k}</b><br><span class="tiny muted">${v.user}</span></td><td>${v.draft?'Yes':'–'}</td><td>${v.complete?'Yes':'–'}</td><td>${v.claims?'Yes':'–'}</td><td>${v.admin?'Yes':'–'}</td></tr>`).join('')}</tbody></table><p class="tiny muted">Inventory permission and marketing permission are separate on purpose.</p></div></div>`;
  if(tab==='audit'){const list=S.audit.filter(a=>a.ent==='policy'||a.ent==='setting'||a.ent==='job').sort((a,b)=>b.ts.localeCompare(a.ts));body=`<div class="card"><div class="hd"><h3>Policy and deletion audit</h3></div><div class="bd">${list.length?`<ul class="audit">${list.map(a=>`<li><time>${fmtDT(a.ts)}</time><div><b>${esc(a.act)}</b> · ${esc(a.id)} <span class="who">· ${esc(a.who)}, ${esc(a.role)}</span><br><span class="small">${esc(a.detail)}</span></div></li>`).join('')}</ul>`:'<div class="empty">Nothing yet.</div>'}</div></div>`}
  return `<div class="pagehead"><div><h1>Admin</h1><div class="sub">Data retention, deletion and platform rules</div></div></div>${tabs}${ro}${body}`;
}
A.policy=(i,v)=>{const p=S.policies[i];const nv=parseInt(v)||0;audit('policy',p.cat,'Retention window changed',`${p.days} → ${nv} days`);p.days=nv;render();toast('Policy updated and logged')};
A.setting=(k,v)=>{const old=S.settings[k];audit('setting',k,'Rule changed',`${old} → ${v}`);S.settings[k]=v;render();toast('Rule updated and logged')};
function jobLog(j,s){j.status=s;j.log.push({ts:nowISO(),s});audit('job',j.id,'Status → '+s,j.label)}
A.jobCancel=id=>{const j=S.jobs.find(x=>x.id===id);if(!confirm('Cancel this deletion request? The record returns to its previous retention state.'))return;jobLog(j,'Cancelled');const r=run(j.entId);if(r&&r.retention==='Pending Deletion')r.retention=r.status==='Archived'?'Archived':'Active';audit('run',j.entId,'Deletion cancelled',j.id);render()};
A.jobApprove=id=>{const j=S.jobs.find(x=>x.id===id);j.readyAt=new Date(Date.now()+j.waitingDays*864e5).toISOString();jobLog(j,'Waiting');render()};
A.jobReady=id=>{const j=S.jobs.find(x=>x.id===id);jobLog(j,'Ready');render()};
A.jobRun=id=>{const j=S.jobs.find(x=>x.id===id);const r=run(j.entId);jobLog(j,'Processing');
  if(!r){jobLog(j,'Failed');j.result='Record not found.';render();return}
  const ts=nowISO();
  if(r.completedAt){// high impact: strip evidence and personal fields; keep operational record because ledger and packaged inventory reference it
    Object.keys(r.evidence).forEach(k=>r.evidence[k]=null);r.name='';r.createdBy='(removed)';r.completedBy='(removed)';r.sup={bottle:'',cap:'',label:'',carton:'',lot:''};r.lossNote='';
    r.retention='Retained by Policy';jobLog(j,'Partial');j.result='Evidence photos and personal fields removed. The operational record, its label snapshot, packaged inventory '+(r.packagedId||'')+' and ledger movements are retained by policy because other records depend on them.';
    audit('run',r.id,'Partial deletion',j.id+': evidence and personal fields removed; operational record retained by policy')}
  else{r.tomb={at:ts,job:j.id};r.retention='Deleted';r.evidence={};r.labelSnapshot=null;r.name='';r.claimIds=[];r.sup={};jobLog(j,'Completed');j.result='Record deleted. Tombstone '+r.id+' written; audit entries retained.';
    audit('run',r.id,'Deleted',j.id+': tombstone written')}
  render();toast('Deletion job '+j.status)};

/* ========================= PUBLIC TRACE PREVIEW ========================= */
function viewTrace(lot){
  const r=S.runs.find(x=>x.lotCode===lot&&x.labelSnapshot);
  if(!r)return `<div class="trace"><h1>Lot not found</h1><p class="muted">No published traceability page for "${esc(lot)}".</p></div><p style="text-align:center;margin-top:10px"><a href="#runs">Back to app</a></p>`;
  const s=r.labelSnapshot;const b=batch(r.sourceId);
  return `<div class="banner info" style="max-width:520px;margin:0 auto 10px">Preview of the public page a QR code resolves to. It shows the printed lot code only; internal record ids are never exposed.</div>
  <div class="trace"><div class="qrbox" aria-hidden="true"></div><div class="brand">${esc(s.brand)}</div><h1>${esc(s.product)}</h1>
  <dl class="kv"><dt>Lot</dt><dd class="mono">${esc(lot)}</dd><dt>Size</dt><dd>${esc(s.volume)}</dd><dt>Bottled</dt><dd>${fmtD(r.dateStart)}</dd><dt>Olives harvested</dt><dd>${b?esc(b.harvest)+', '+esc(S.farm.region):'–'}</dd><dt>On the label</dt><dd>${s.claims.map(c=>esc(c.text)).join(', ')||'–'}</dd>${r.bestBefore.text?`<dt>Date label</dt><dd>${esc(r.bestBefore.text)}</dd>`:''}</dl>
  <p class="tiny muted" style="margin-top:14px">${esc(s.legal)}</p></div><p style="text-align:center;margin-top:10px"><a href="#run/${r.id}">Back to run</a></p>`;
}

/* ========================= BOOT ========================= */
function setOnline(on){S.online=on;const n=$('#net');n.classList.toggle('off',!on);$('#netLabel').textContent=on?'Online':'Offline';$('#offlineBar').classList.toggle('show',!on);
  if(on&&S.queue.length){const n=S.queue.length;S.queue.forEach(q=>{const r=run(q.id);if(r){r.syncState='synced';audit('run',r.id,'Synced from offline queue',q.kind+' saved at '+fmtDT(q.at))}});S.queue=[];toast(n+' queued change'+(n>1?'s':'')+' synced');}
  render()}
$('#net').addEventListener('click',()=>setOnline(!S.online));
$('#net').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setOnline(!S.online)}});
const rs=$('#roleSel');rs.innerHTML=Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v.user} · ${k}</option>`).join('');rs.value=S.role;
rs.addEventListener('change',()=>{S.role=rs.value;if(location.hash.startsWith('#labels')&&!perm().claims)location.hash='#home';render();toast('Now acting as '+me()+' ('+S.role+')')});
if(!location.hash)location.hash='#home';render();
</script>
</body>
</html>
